<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>AgriCloud system architecture</title>
<desc>Browser requests flow through Nginx to a Flask app on EC2, which connects to DynamoDB, S3+Athena, a forecast model, and the Gemini API. GitHub Actions auto-deploys to EC2 on push.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="480" fill="#ffffff"/>

<rect x="260" y="40" width="160" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Browser / user</text>

<line x1="340" y1="84" x2="340" y2="122" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="260" y="124" width="160" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Nginx (HTTPS)</text>

<line x1="340" y1="168" x2="340" y2="208" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="460" y="40" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="540" y="64" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">GitHub Actions</text>
<text x="540" y="82" text-anchor="middle" font-size="12" fill="#3C3489">Push-to-deploy</text>

<path d="M540 96 L540 180 L480 180 L480 208" fill="none" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="190" y="210" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="234" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Flask + Gunicorn</text>
<text x="340" y="252" text-anchor="middle" font-size="12" fill="#444441">EC2, systemd-managed</text>

<line x1="340" y1="266" x2="340" y2="300" stroke="#5f5e5a" stroke-width="1.5"/>
<line x1="115" y1="300" x2="565" y2="300" stroke="#5f5e5a" stroke-width="1.5"/>
<line x1="115" y1="300" x2="115" y2="378" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="265" y1="300" x2="265" y2="378" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="415" y1="300" x2="415" y2="378" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="565" y1="300" x2="565" y2="378" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="50" y="380" width="130" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="115" y="404" text-anchor="middle" font-size="14" font-weight="600" fill="#042C53">DynamoDB</text>
<text x="115" y="422" text-anchor="middle" font-size="12" fill="#0C447C">GSI-optimized</text>

<rect x="200" y="380" width="130" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="265" y="404" text-anchor="middle" font-size="14" font-weight="600" fill="#042C53">S3 + Athena</text>
<text x="265" y="422" text-anchor="middle" font-size="12" fill="#0C447C">Data lake</text>

<rect x="350" y="380" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="415" y="404" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">ML forecast</text>
<text x="415" y="422" text-anchor="middle" font-size="12" fill="#085041">RandomForest</text>

<rect x="500" y="380" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="565" y="404" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">Gemini API</text>
<text x="565" y="422" text-anchor="middle" font-size="12" fill="#085041">AI assistant</text>
</svg>
