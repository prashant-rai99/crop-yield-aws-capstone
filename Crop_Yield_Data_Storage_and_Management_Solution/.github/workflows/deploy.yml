name: Deploy to EC2

on:
  push:
    branches: [main]
    paths:
      - "Crop_Yield_Data_Storage_and_Management_Solution/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/crop-yield-aws-capstone
            git pull origin main
            cd Crop_Yield_Data_Storage_and_Management_Solution
            source venv/bin/activate
            pip install -r requirements.txt
            sudo systemctl restart cropyield